name: Deploy Cloudflare Worker (Manual)

on:
  workflow_dispatch:
    inputs:
      api_token:
        description: "Cloudflare API Token"
        required: true
        type: string
      account_id:
        description: "Cloudflare Account ID"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Publish to Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ inputs.api_token }}
          accountId: ${{ inputs.account_id }}
          command: deploy index.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ inputs.api_token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account_id }}
